# Integración continua (RNF-007 y RNF-004): en cada push y en cada pull request revisa el estilo
# del servicio, corre sus pruebas con cobertura mínima de 70 %, compila el dashboard y busca
# secretos en el historial.
name: CI

on:
  push:
  pull_request:

jobs:
  servicio:
    name: Servicio (estilo, pruebas y cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # calidad_agua sale de la rama del mismo nombre en el repositorio de modelos (p. ej. tres-nodos),
      # porque el servicio y los modelos cambian juntos; si esa rama no existe allá, de main
      - name: Instalar (con el paquete calidad_agua del repositorio de modelos)
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: |
          pip install -r requirements-dev.txt
          MODELOS=https://github.com/evproyectos/Modelo_calidad_agua.git
          if git ls-remote --exit-code --heads "$MODELOS" "$RAMA" > /dev/null; then REF="$RAMA"; else REF=main; fi
          echo "calidad_agua de la rama $REF de Modelo_calidad_agua"
          pip install "calidad-agua[red] @ git+$MODELOS@$REF"
      - name: Estilo (flake8)
        run: flake8
      - name: Pruebas y cobertura (mínimo 70 %)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=70
      - name: Resumen de cobertura
        if: always()
        run: |
          echo "## Cobertura del servicio" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  dashboard:
    name: Dashboard (compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  secretos:
    name: Búsqueda de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks directo (no la acción gitleaks-action, que en un push revisa solo el rango de
      # commits desde el anterior y falla si ese commit no existe, como en el primer push)
      - name: Instalar gitleaks
        run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
      - name: Buscar secretos en todo el historial
        run: ./gitleaks git --redact --verbose .
