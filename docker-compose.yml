# Sistema completo con un solo comando (RNF-008), desde esta carpeta:
#
#     docker compose up --build
#
# Modelo_calidad_agua tiene que estar clonado al lado de este proyecto (en la misma carpeta, como
# en D:\Practica_Profesional). Los modelos entrenados y la historia de MLflow no se versionan: si
# no están, el servicio `preparar` los descarga del release de GitHub que nombra
# Modelo_calidad_agua/artefactos.json y comprueba su huella SHA-256.
#
# Servicios:
#   preparar    descarga los modelos si faltan y termina
#   monitoreo   servicio con el dashboard                    http(s)://127.0.0.1:8001
#   mlflow      experimentos de los notebooks                http://127.0.0.1:5000
#   db          PostgreSQL con TimescaleDB: el servicio guarda ahí los resultados de cada hora
#   datos       solo con el perfil `simulador`: API de datos con el dataset del simulador
#   emisor      solo con el perfil `simulador`: manda las lecturas de la prueba a la API de datos
#   mailpit     solo con el perfil `correo`: correo de prueba que recibe los correos de las alertas
#               y los muestra en http://127.0.0.1:8025
#
# De dónde salen las lecturas: URL_DATOS_DOCKER en el .env (la API que mande los datos de los
# sensores; URL_DATOS es la del servicio sin Docker). Sin ella se usa la API del simulador
# (servicio `datos`), que necesita Simulador_sensor al lado y el perfil: COMPOSE_PROFILES=simulador
# en el .env, o  docker compose --profile simulador up.
# Los perfiles se suman con comas: COMPOSE_PROFILES=simulador,correo
#
# Los secretos (SMTP_CONTRASENA, TELEGRAM_TOKEN, CLAVES_API, ...) van en el .env de esta carpeta, que no se
# versiona; sin él el servicio funciona igual, con las alertas en la consola. Si el .env tiene
# CERTIFICADO_TLS y CLAVE_TLS, el servicio atiende por HTTPS con los archivos de secretos/.

services:
  preparar:
    image: python:3.13-slim
    command: ["python", "/preparar.py"]
    environment:
      ARTEFACTOS_URL: ${ARTEFACTOS_URL:-}
    volumes:
      - ../Modelo_calidad_agua:/modelo
      - ./docker/preparar.py:/preparar.py:ro
    restart: "no"

  datos:
    profiles: ["simulador"]
    build:
      context: ..
      dockerfile: Monitoreo_calidad_agua/docker/datos.Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ../Simulador_sensor/datos:/app/datos:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/estado', timeout=4)"]
      interval: 10s
      retries: 10
    restart: unless-stopped        # si se cae, Docker lo levanta de nuevo (RNF-002)

  emisor:
    profiles: ["simulador"]
    build:
      context: ..
      dockerfile: Monitoreo_calidad_agua/docker/datos.Dockerfile
    command: ["python", "-m", "tiempo_real.emisor", "--url", "http://datos:8000", "--velocidad", "${VELOCIDAD:-1}", "--precarga-dias", "31"]
    volumes:
      - ../Simulador_sensor/datos:/app/datos:ro
    depends_on:
      datos: {condition: service_healthy}
      monitoreo: {condition: service_healthy}
    restart: "no"

  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: monitoreo
      POSTGRES_USER: monitoreo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitoreo}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoreo -d monitoreo"]
      interval: 5s
      retries: 20
    restart: unless-stopped        # si se cae, Docker lo levanta de nuevo (RNF-002)

  monitoreo:
    build:
      context: ..
      dockerfile: Monitoreo_calidad_agua/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      URL_DATOS: ${URL_DATOS_DOCKER:-http://datos:8000}
      MLFLOW_URL: http://mlflow:5000            # el F1 de cada día (rendimiento.py, RNF-003)
      CARPETA_MODELOS: /modelos
      CARPETA_REGISTROS: /registros
      BASE_DE_DATOS: postgresql://monitoreo:${POSTGRES_PASSWORD:-monitoreo}@db:5432/monitoreo
    ports: ["127.0.0.1:8001:8001"]
    volumes:
      - ../Modelo_calidad_agua/modelos:/modelos:ro
      - ./backend/registros:/registros
      # certificado de HTTPS (CERTIFICADO_TLS=secretos/certificado.pem en el .env); sin él, HTTP
      - ./secretos:/app/secretos:ro
    depends_on:
      preparar: {condition: service_completed_successfully}
      datos: {condition: service_healthy, required: false}      # solo con el perfil simulador
      db: {condition: service_healthy}
    restart: unless-stopped        # si se cae, Docker lo levanta de nuevo (RNF-002)

  mlflow:
    build:
      dockerfile_inline: |
        FROM python:3.13-slim
        RUN pip install --no-cache-dir "mlflow==3.17.2"
    # --allowed-hosts: además del navegador (127.0.0.1:5000), el servicio de monitoreo, que registra el
    # F1 de cada día; sin esto MLflow rechaza las solicitudes que llegan como mlflow:5000
    command: ["mlflow", "ui", "--backend-store-uri", "sqlite:////modelo/mlflow.db", "--host", "0.0.0.0",
              "--port", "5000", "--workers", "1",
              "--allowed-hosts", "mlflow:5000,localhost:5000,127.0.0.1:5000"]
    ports: ["127.0.0.1:5000:5000"]
    # toda la carpeta: si se montara mlflow.db sola y todavía no existiera, Docker crearía una carpeta
    # con ese nombre. Los archivos de cada corrida quedan en /modelo/mlartifacts
    volumes:
      - ../Modelo_calidad_agua:/modelo
    depends_on:
      preparar: {condition: service_completed_successfully}
    restart: unless-stopped        # si se cae, Docker lo levanta de nuevo (RNF-002)

  # correo de prueba (opcional): con SMTP_SERVIDOR=mailpit, SMTP_PUERTO=1025, SMTP_SEGURIDAD=ninguna
  # y SMTP_REMITENTE=alertas@asada.local en el .env, los correos llegan aquí y no a nadie de verdad
  mailpit:
    image: axllent/mailpit:v1.28.2
    profiles: ["correo"]
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped        # si se cae, Docker lo levanta de nuevo (RNF-002)

volumes:
  db:
